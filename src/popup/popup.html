<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CleanTube Ad Hider</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="app-shell">
      <header class="brand">
        <img
          class="brand-logo"
          src="../../assets/icons/icon-128.png"
          alt="CleanTube logo"
        />
        <div class="brand-copy">
          <h1>CleanTube</h1>
          <p>শান্তিতে ভিডিও দেখুন</p>
        </div>
        <span class="version">v1.4.1</span>
      </header>

      <section class="hero" aria-labelledby="protection-title">
        <div class="hero-top">
          <div class="status-icon" aria-hidden="true">
            <span>✓</span>
          </div>
          <span id="statusBadge" class="status-badge">সুরক্ষা চালু</span>
        </div>
        <h2 id="protection-title">আপনার YouTube এখন পরিষ্কার</h2>
        <p id="heroDescription">বিজ্ঞাপনগুলো স্বয়ংক্রিয়ভাবে hide ও skip হবে।</p>
      </section>

      <section class="features" aria-label="সক্রিয় সুবিধা">
        <div class="feature">
          <span class="feature-icon purple" aria-hidden="true">↗</span>
          <span>
            <strong>Auto Skip</strong>
            <small>ভিডিও বিজ্ঞাপন</small>
          </span>
        </div>
        <div class="feature">
          <span class="feature-icon pink" aria-hidden="true">✦</span>
          <span>
            <strong>Clean View</strong>
            <small>Banner ও overlay</small>
          </span>
        </div>
        <div class="feature">
          <span class="feature-icon blue" aria-hidden="true">⌁</span>
          <span>
            <strong>Private</strong>
            <small>কোনো tracking নেই</small>
          </span>
        </div>
      </section>

      <label class="control" for="enabled">
        <span class="control-copy">
          <span class="power-dot" aria-hidden="true"></span>
          <span>
            <strong>Ad protection</strong>
            <small id="status">চালু আছে</small>
          </span>
        </span>
        <input id="enabled" type="checkbox" role="switch" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <footer>
        <span class="live-dot" aria-hidden="true"></span>
        youtube.com-এ সক্রিয়
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
