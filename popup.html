<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="logo">
          <img src="assets/icons/icon-128.png" alt="">
        </div>
        <div>
          <h1>CleanTube</h1>
          <p>Cleaner viewing, automatically</p>
        </div>
        <span class="version">v1.0</span>
      </header>

      <label class="setting primary">
        <span>
          <strong>Protection</strong>
          <small>Keep YouTube distraction-free</small>
        </span>
        <input id="enabled" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
      </label>

      <section id="options">
        <label class="setting">
          <span>
            <strong>Auto skip</strong>
            <small>Clicks Skip as soon as it appears</small>
          </span>
          <input id="autoSkip" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="setting">
          <span>
            <strong>Fast-forward video ads</strong>
            <small>Speeds through in-stream and bumper ads</small>
          </span>
          <input id="fastForwardVideoAds" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="setting">
          <span>
            <strong>Hide promoted content</strong>
            <small>Removes feed, masthead and Shorts ads</small>
          </span>
          <input id="hidePromotedContent" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <footer>
        <p class="status"><span id="statusDot"></span><span id="statusText"></span></p>
        <span class="privacy">No tracking</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
